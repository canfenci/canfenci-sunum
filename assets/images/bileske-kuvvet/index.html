<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CanFenci | Kalıtım Etkileşimli Sunum</title><style>
:root{--navy:#102b66;--blue:#1763c6;--green:#178667;--yellow:#f6c453;--ink:#15294b;--soft:#f2f7ff;--muted:#59708e;--stroke:#dae5f2}*{box-sizing:border-box}body{margin:0;background:#e7f0fa;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #ffb000;outline-offset:2px}.app{min-height:100dvh;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:18px;justify-content:space-between;background:var(--navy);color:white;padding:12px 24px}.brand{font-weight:900;letter-spacing:.4px;font-size:1.2rem}.sub{font-size:.86rem;opacity:.85}.counter{font-weight:800;white-space:nowrap}.progress{height:5px;background:#b9d2f3}.progress>div{height:100%;background:var(--yellow);transition:width .25s}.slide{width:min(1250px,96vw);min-height:calc(100dvh - 145px);margin:16px auto;padding:clamp(22px,3vw,44px);background:white;border-radius:24px;box-shadow:0 10px 32px #0d325619;display:flex;flex-direction:column;gap:18px}.eyebrow{color:var(--blue);font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px}.slide h1{font-size:clamp(2rem,3.6vw,3.3rem);line-height:1.1;margin:0;color:var(--navy)}.lead{font-size:clamp(1.2rem,2vw,1.55rem);line-height:1.5;max-width:950px;margin:0}.small{color:var(--muted);font-size:.95rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:var(--soft);border:2px solid var(--stroke);border-radius:16px;padding:19px;text-align:left;min-height:100px}.card h3{margin:0 0 8px;font-size:1.14rem}.card p{margin:0;line-height:1.5}.card.button{transition:.2s}.card.button:hover,.card.button.active{border-color:var(--blue);background:#e9f2ff}.card.correct{border-color:#2ea77d;background:#e8fbf2}.card.wrong{border-color:#d85f61;background:#fff0f0}.note{border-left:6px solid var(--green);background:#eaf8f3;padding:15px 20px;border-radius:8px;font-size:1.1rem;line-height:1.5}.question{font-size:1.28rem;font-weight:800;color:var(--navy)}.actions{display:flex;flex-wrap:wrap;gap:12px}.btn{border:0;background:var(--blue);color:white;font-weight:800;border-radius:12px;padding:12px 18px}.btn.alt{color:var(--navy);background:#e9f2ff;border:2px solid #c9dcfb}.btn.gold{background:#e9aa23;color:#162c58}.feedback{min-height:54px;background:#f5f8fe;padding:14px 17px;border-radius:12px;line-height:1.45}.feedback:empty{display:none}.footer{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:6px max(2vw,18px) 16px}.footer .btn{min-width:124px}.footer button:disabled{opacity:.4;cursor:not-allowed}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.pill{display:inline-flex;background:#eef4ff;border:2px solid #d1dff3;border-radius:30px;padding:9px 16px;font-size:1.15rem;font-weight:800}.punnett{border-collapse:separate;border-spacing:9px;margin:8px auto}.punnett td,.punnett th{height:92px;width:118px;text-align:center;border-radius:14px;font-size:2rem;font-weight:900;background:#eff5ff;color:var(--navy)}.punnett th{background:#cfe3ff}.punnett td.hidden{color:#a0b8d3}.punnett td.revealed{background:#def5e9}.score{font-size:1.15rem;font-weight:800}.visual{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;padding:18px;background:linear-gradient(135deg,#f1f7ff,#e5f3ff);border-radius:18px;min-height:150px}.seed{border-radius:49% 52% 48% 53%;width:85px;height:85px;background:#f6d24e;border:3px solid #cfad29;box-shadow:inset -12px -10px 0 #e7bd32}.seed.green{background:#8cc874;border-color:#458d51;box-shadow:inset -12px -10px 0 #76b463}.flower{font-size:5rem;line-height:1}.karyotype{font-size:3.2rem;font-weight:900;color:#1a569b;letter-spacing:5px}.person{font-size:2.5rem}.steps{display:flex;gap:12px;flex-wrap:wrap}.step{flex:1;min-width:170px;padding:20px;border-radius:14px;background:#f2f6fe;border-top:6px solid var(--blue)}.step strong{display:block;font-size:1.08rem}.choice{border:2px solid #cadef2;border-radius:12px;background:#f7faff;color:var(--ink);text-align:left;padding:15px;font-weight:700}.choice:hover{background:#e7f1ff}.choice.selected{border-color:#2467bd}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pedigree{display:flex;flex-wrap:wrap;gap:17px;justify-content:center;align-items:center;font-size:3rem}.symbol{display:inline-flex;justify-content:center;align-items:center;width:73px;height:73px;border:4px solid var(--navy);font-weight:900;background:white}.symbol.round{border-radius:50%}.symbol.filled{background:var(--navy)}.symbol.half{background:linear-gradient(90deg,var(--navy) 50%,white 50%)}.separator{font-size:2.2rem;color:#8da5c9}.line{height:2px;background:#abc0d9;margin:3px 0}.select{font-size:1.1rem;padding:10px 15px;border-radius:12px;border:2px solid var(--stroke)}.center{text-align:center}.mark{background:#fff3cd;padding:3px 8px;border-radius:8px}.spacer{flex:1}@media(max-width:700px){.top{padding:12px}.grid2,.choices{grid-template-columns:1fr}.slide{width:98vw;border-radius:15px;min-height:calc(100dvh - 145px);padding:20px}.punnett td,.punnett th{height:65px;width:72px;font-size:1.45rem}.sub{display:none}.card{min-height:80px}.footer .btn{min-width:auto}}
</style></head><body><div class="app"><header class="top"><div><div class="brand">CanFenci <span class="sub"> | 8. SINIF FEN BİLİMLERİ</span></div><div class="sub">2. ÜNİTE · DNA VE GENETİK KOD · KALITIM</div></div><div id="counter" class="counter">1 / 20</div></header><div class="progress"><div id="bar"></div></div><main id="root" class="slide" aria-live="polite"></main><div class="footer"><button class="btn alt" id="prev">← Önceki</button><span class="small">← / → tuşlarıyla ilerle · Akıllı tahta ve dokunmatik uyumlu</span><button class="btn" id="next">Sonraki →</button></div></div><script>
const root=document.getElementById('root');let idx=0;let state={};const slideTitles=['KALITIM','Karakter nedir?','Kalıtım ve Mendel','Temel kavramlar','Baskın ve çekinik alel','Saf döl ve melez döl','Genotip ve fenotip','Çaprazlama nasıl yapılır?','Çaprazlama örneği 1','Çaprazlama örneği 2','Çaprazlama örneği 3','Çaprazlama örneği 4','Mendel\'in çaprazlama deneyi','İnsanda cinsiyetin belirlenmesi','Soyağacını okuyalım','Soyağacı örneği','Akraba evlilikleri ve genetik risk','Örnek soru 1','Örnek soru 2','Örnek soru 3'];
const slideHead=(n,subtitle='')=>`<div class="eyebrow">Slayt ${n} · ${subtitle || 'Kalıtım'}</div><h1>${slideTitles[n-1]}</h1>`;
const note=(s)=>`<div class="spacer"></div><div class="note">${s}</div>`;
const selectCards=(items,explain)=>`<div class="cards">${items.map((x,i)=>`<button class="card button" onclick="chooseCard(${i},${JSON.stringify(x[2])})"><h3>${x[0]}</h3><p>${x[1]}</p></button>`).join('')}</div><div id="response" class="feedback">Bir kart seçerek açıklamayı gör.</div>`;
function chooseCard(i,msg){document.querySelectorAll('.card.button').forEach((b,k)=>b.classList.toggle('active',k===i));document.getElementById('response').textContent=msg;}
const gametes=g=>g.split('');const combo=(a,b)=>[a,b].sort((x,y)=>x===x.toUpperCase()?-1:1).join('');function grid(a,b){let A=gametes(a),B=gametes(b);return `<table class="punnett"><tr><th>×</th>${B.map(c=>`<th>${c}</th>`).join('')}</tr>${A.map(x=>`<tr><th>${x}</th>${B.map(y=>`<td class="hidden" data-val="${combo(x,y)}">?</td>`).join('')}</tr>`).join('')}</table>`;}
function revealCells(){document.querySelectorAll('.punnett td').forEach(x=>{x.textContent=x.dataset.val;x.classList.remove('hidden');x.classList.add('revealed');});document.getElementById('response').innerHTML=document.getElementById('answer').innerHTML;}
function cross(a,b,text){return `<p class="lead">${text}</p><div class="visual"><span class="pill">${a}</span><span class="separator">×</span><span class="pill">${b}</span></div>${grid(a,b)}<div class="actions"><button class="btn" onclick="revealCells()">Yavruları göster</button><button class="btn alt" onclick="render()">Yeniden dene</button></div><div id="answer" hidden></div><div id="response" class="feedback">Önce yavruların genotipini tahmin edin; sonra sonucu açın.</div>`;}
function quiz(q,options,right,why){return `<div class="question">${q}</div><div class="choices">${options.map((c,i)=>`<button class="choice" onclick="check(${i},${right},${JSON.stringify(why)})">${'ABCD'[i]}) ${c}</button>`).join('')}</div><div class="feedback" id="response">Önce düşün, sonra yanıtla.</div>`;}
function check(n,r,msg){document.querySelectorAll('.choice').forEach((b,i)=>{b.classList.toggle('selected',i===n);b.classList.toggle('correct',i===r);b.classList.toggle('wrong',i===n&&n!==r)});document.getElementById('response').innerHTML=`<strong>${n===r?'Doğru!':'Bir daha düşün.'}</strong> ${msg}`;}
const content=[
()=>`${slideHead(1,'Konuya giriş')}<div class="visual" style="flex:1;min-height:280px"><span class="flower">🌸</span><span class="karyotype">AA · Aa · aa</span><span class="flower">🌱</span></div><p class="lead center" style="margin:auto">Neden anne babamıza benzeriz ama onlarla tamamen aynı olmayız?</p>${note('Ana fikir: Kalıtsal özellikler, anne ve babadan gelen genlerle yavrulara aktarılır.')}`,
()=>`${slideHead(2,'Kavram keşfi')}<p class="question">Aşağıdakilerden hangileri kalıtsal, hangileri sonradan kazanılmıştır?</p>${selectCards([['Kan grubu','Bir bireyin kan grubu','Kan grubu kalıtsal bir özelliktir.'],['Bisiklet sürmeyi öğrenme','Öğrenme ve deneyim','Bisiklet sürmek sonradan öğrenilen bir beceridir; kalıtımla doğrudan aktarılmaz.'],['Bezelyede tohum rengi','Sarı veya yeşil','Bezelyede tohum rengi kalıtsal bir karakterdir.'],['Güneşte bronzlaşma','Işığa bağlı geçici değişim','Bronzlaşma çevre etkisiyle oluşabilir; kazanılmış bronz ten kalıtsal değildir.']])}${note('Karakter: Canlılarda incelenen özellik. Kalıtsal karakterler, genlerle nesilden nesile aktarılabilir.')}`,
()=>`${slideHead(3,'Bilim tarihi')}<p class="lead">Gregor Mendel, bezelyeler üzerinde deneyler yaparak kalıtsal özelliklerin kuşaklar boyunca nasıl aktarıldığını araştırdı.</p><div class="question">Mendel neden bezelyeleri seçmiş olabilir?</div>${selectCards([['Kolay yetişir','Kısa sürede çok sayıda yavru verir.','Evet. Nesilleri kısa zamanda karşılaştırmak deneyleri kolaylaştırır.'],['Özellikler ayırt edilir','Sarı-yeşil, düzgün-buruşuk gibi seçenekler vardır.','Evet. Belirgin zıt özellikler, sonucu gözlemlemeyi kolaylaştırır.'],['Kontrollü çaprazlanır','Hangi bitkilerin çaprazlandığı seçilebilir.','Evet. Kontrollü çaprazlama sonuçların yorumlanmasını sağlar.']])}${note('Mendel: Kalıtımın temel ilkelerini bezelye deneyleriyle açıklayan bilim insanı.')}`,
()=>`${slideHead(4,'Model üzerinde keşfet')}<p class="lead">Gen, bir kalıtsal özelliğin ortaya çıkmasında etkili olan DNA bölümüdür. Bir genin farklı biçimlerine <strong>alel</strong> denir.</p><div class="visual"><div class="card"><h3>Homolog kromozom çifti</h3><div class="karyotype center">│A│ &nbsp; │a│</div><p class="center small">Biri anneden, biri babadan gelen eş kromozomlar üzerinde ilgili genlerin konumları</p></div><div class="card"><h3>Alel çifti</h3><div class="karyotype center">A + a</div><p class="center small">Aynı karakter için iki farklı alel</p></div></div>${note('Homolog kromozomlar: Biri anneden, diğeri babadan gelen; aynı karakterlere ait genleri karşılıklı konumlarda taşıyan kromozomlar.')}`,
()=>`${slideHead(5,'Neden baskın?')}<p class="lead">Bezelyelerde mor çiçek aleli (M), beyaz çiçek aleline (m) baskındır.</p><div class="cards"><button class="card button" onclick="chooseCard(0,'MM → mor çiçek; iki alel de baskındır.')"><h3>MM</h3><p>Fenotipi tahmin et.</p></button><button class="card button" onclick="chooseCard(1,'Mm → mor çiçek; baskın M aleli fenotipte görülür, m ise genotipte bulunur.')"><h3>Mm</h3><p>Fenotipi tahmin et.</p></button><button class="card button" onclick="chooseCard(2,'mm → beyaz çiçek; çekinik özellik iki çekinik alel birlikteyken ortaya çıkar.')"><h3>mm</h3><p>Fenotipi tahmin et.</p></button></div><div id="response" class="feedback">Bir genotipe dokun.</div>${note('Baskın alel büyük harfle, çekinik alel aynı harfin küçüğüyle gösterilir. Baskınlık “daha güçlü” anlamına gelmez.')}`,
()=>`${slideHead(6,'Karşılaştır')}<p class="question">Hangi genotipler saf, hangisi melez?</p>${selectCards([['AA','Aynı iki baskın alel','AA → saf döl (homozigot baskın).'],['Aa','İki farklı alel','Aa → melez döl (heterozigot).'],['aa','Aynı iki çekinik alel','aa → saf döl (homozigot çekinik).']])}${note('Saf döl: AA / aa · Melez döl: Aa. Saf olmak baskın olmak anlamına gelmez.')}`,
()=>`${slideHead(7,'Kavramları ayırt et')}<p class="lead">Bezelyelerde sarı tohum (S) yeşile (s) baskındır. <strong>Ss</strong> genotipine sahip bezelyenin fenotipi nedir?</p><div class="visual"><div><h3>Genotip</h3><span class="karyotype">Ss</span></div><span class="separator">→</span><div><h3>Fenotip</h3><div class="seed"></div></div></div>${selectCards([['Genotip','Alellerin harflerle gösterimi','Ss bir karakter için genotipi gösterir.'],['Fenotip','Gözlenebilen özellik','Sarı tohum fenotiptir.'],['Aynı fenotip, farklı genotip','SS ve Ss ikisi de sarı','SS ve Ss aynı baskın fenotipi gösterebilir; genotipleri farklıdır.']])}${note('Genotip = kalıtsal yapı · Fenotip = genotip ve çevrenin etkisiyle ortaya çıkan özellik.')}`,
()=>`${slideHead(8,'İşlem sırası')}<p class="lead">Punnett karesi yavrularda ortaya çıkabilecek alel birleşimlerini gösterir.</p><div class="steps"><div class="step"><strong>1 · Harfleri belirle</strong><p>Baskın ve çekinik aleli aynı harfle yaz.</p></div><div class="step"><strong>2 · Ebeveynleri yaz</strong><p>Örn. Aa × Aa</p></div><div class="step"><strong>3 · Alelleri ayır</strong><p>Her ebeveyn bir alel verir.</p></div><div class="step"><strong>4 · Kareyi doldur</strong><p>Genotip ve fenotip olasılıklarını yorumla.</p></div></div>${grid('Aa','Aa')}<div class="actions"><button class="btn" onclick="revealCells()">Kareyi doldur</button><button class="btn alt" onclick="render()">Sıfırla</button></div><div id="response" class="feedback">Her kesişimde bir anneden, bir babadan gelen alel bulunur.</div><div id="answer" hidden>Genotip: %25 AA, %50 Aa, %25 aa.</div>${note('Çaprazlama sonuçları kesin yavru sayısını değil, olasılıkları gösterir.')}`,
()=>`${slideHead(9,'Saf × saf')}${cross('AA','aa','Yuvarlak tohum (A), buruşuk tohuma (a) baskın. Saf yuvarlak ve saf buruşuk bezelye çaprazlanıyor.') }${answer('Tüm yavrular Aa (%100), fenotipleri yuvarlak (%100).')}${note('Birinci kuşakta bütün yavrular melez ve baskın fenotiplidir.')}`,
()=>`${slideHead(10,'Melez × melez')}${cross('Aa','Aa','İki melez yuvarlak tohumlu bezelye çaprazlanıyor. Buruşuk yavru oluşabilir mi?')}${answer('%25 AA, %50 Aa, %25 aa; %75 yuvarlak, %25 buruşuk.')}${note('Bu çaprazlamada genotip 1:2:1, fenotip 3:1 oranındadır.')}`,
()=>`${slideHead(11,'Melez × saf çekinik')}${cross('Aa','aa','Melez yuvarlak tohumlu bezelye ile saf buruşuk bezelye çaprazlanıyor.')}${answer('%50 Aa (yuvarlak), %50 aa (buruşuk).')}${note('Baskın ve çekinik fenotiplerin görülme olasılığı eşittir.')}`,
()=>`${slideHead(12,'Melez × saf baskın')}${cross('Aa','AA','Melez yuvarlak tohumlu bezelye ile saf yuvarlak bezelye çaprazlanıyor.')}${answer('%50 AA, %50 Aa; %100 yuvarlak fenotip.')}${note('Bütün yavrular baskın fenotip gösterse de genotipleri aynı olmayabilir.')}`,
()=>`${slideHead(13,'Mendel deneyi')}<p class="lead">Saf sarı (SS) × saf yeşil (ss) bezelyeler çaprazlandığında ne olur? Oluşan F1 bireyleri de kendi aralarında çaprazlayalım.</p><div class="steps"><div class="step"><strong>Başlangıç (P)</strong><h2>SS × ss</h2><p>Saf sarı × saf yeşil</p></div><div class="step"><strong>Birinci kuşak (F1)</strong><h2>Hepsi Ss</h2><p>%100 sarı</p></div><div class="step"><strong>İkinci kuşak (F2)</strong><h2>Ss × Ss</h2><p>Beklenti: %75 sarı, %25 yeşil</p></div></div><div class="actions"><button class="btn" onclick="revealText('response','Çekinik yeşil özellik F1 kuşağında görünmese de alel kaybolmaz; F2 kuşağında ss birleşiminde tekrar ortaya çıkabilir.')">Neden yeşil yeniden ortaya çıktı?</button></div><div id="response" class="feedback">Önce tahmin edin.</div>${note('Çekinik alel kuşaklar arasında kaybolmaz; uygun birleşimde fenotipte ortaya çıkar.')}`,
()=>`${slideHead(14,'Eşey kromozomları')}<p class="lead">İnsanda yumurta X, sperm ise X veya Y eşey kromozomu taşır.</p><div class="visual"><div class="card center"><h3>Anne</h3><div class="karyotype">XX</div></div><div class="card center"><h3>Baba</h3><div class="karyotype">XY</div></div></div><table class="punnett"><tr><th>×</th><th>X</th><th>Y</th></tr><tr><th>X</th><td>XX</td><td>XY</td></tr><tr><th>X</th><td>XX</td><td>XY</td></tr></table><div class="question center">Her gebelikte olasılık: %50 XX ve %50 XY</div>${note('Çocuğun kromozomal cinsiyetinin belirlenmesinde babadan gelen X veya Y kromozomu etkilidir.')}`,
()=>`${slideHead(15,'Sembolleri çöz')}<p class="lead">Soyağacı, ailede bir özelliğin kuşaklar arasındaki dağılımını gösteren şemadır.</p><div class="cards"><div class="card center"><div class="symbol" style="margin:auto"></div><h3>Kare</h3><p>Erkek birey</p></div><div class="card center"><div class="symbol round" style="margin:auto"></div><h3>Daire</h3><p>Kadın birey</p></div><div class="card center"><div class="symbol filled" style="margin:auto"></div><h3>İçi dolu sembol</h3><p>İncelenen özelliği gösteren birey</p></div><div class="card center"><div class="symbol half round" style="margin:auto"></div><h3>Yarım tarama</h3><p>Bazı şemalarda taşıyıcıyı temsil eder</p></div></div>${note('Soyağacı sembolleri destekleyici bilgidir. Ayrıntılı lise düzeyindeki kalıtım örüntüsü analizlerine girilmez.')}`,
()=>`${slideHead(16,'Soyağacını yorumla')}<p class="lead">Şemadaki anne ve baba, bezelye örneğinde incelenen çekinik özelliğin alelini taşıyan iki melez birey olarak modellenmiştir.</p><div class="visual"><div class="card center"><div class="person">□</div><h3>Aa</h3><p>Baba</p></div><span class="separator">—</span><div class="card center"><div class="person">○</div><h3>Aa</h3><p>Anne</p></div></div><div class="question center">Bu çaprazlamada aa yavru oluşma olasılığı nedir?</div>${quiz('Aa × Aa çaprazlaması için doğru seçenek:', ['%0','%25','%50','%100'],1,'AA, Aa, Aa ve aa birleşimleri oluşur. Dört olasılığın biri aa genotipidir.')}${note('Burada amaç yalnızca Punnett karesini aile şemasıyla ilişkilendirmektir.')}`,
()=>`${slideHead(17,'Müfredat kazanımı')}<p class="lead">Akraba bireyler, aynı çekinik hastalık alelini ortak atalarından alma bakımından akraba olmayanlara göre daha yüksek olasılığa sahip olabilir.</p><div class="steps"><div class="step"><strong>Ortak alel ihtimali</strong><p>Akrabalarda bazı aynı alellerin paylaşılma olasılığı artabilir.</p></div><div class="step"><strong>İki taşıyıcı ebeveyn</strong><p>Aa × Aa örneğinde aa yavru olasılığı %25'tir.</p></div><div class="step"><strong>Doğru çıkarım</strong><p>Akraba evliliği hastalığı kesinleştirmez; bazı çekinik hastalıkların riskini artırabilir.</p></div></div>${note('Kalıtsal hastalıklar yalnızca akraba evliliklerinde görülmez. Her hastalık için %25 riski genellemek yanlıştır.')}`,
()=>`${slideHead(18,'LGS düzeyi')}${quiz('Mor (M) beyaza (m) baskındır. Mor çiçekli iki bezelyeden beyaz çiçekli yavru oluşmuştur. Ebeveynlerin genotipi ne olabilir?', ['MM × MM','MM × Mm','Mm × Mm','MM × mm'],2,'Beyaz yavru mm olmalıdır. Bu nedenle iki ebeveyn de m alelini taşımalıdır; mor oldukları için genotipleri Mm olabilir.')}${note('Anahtar düşünme adımı: Çekinik yavru oluştuysa her iki ebeveynden de çekinik alel gelmiştir.')}`,
()=>`${slideHead(19,'LGS düzeyi')}${quiz('Aa × aa çaprazlaması için aşağıdaki ifadelerden hangisi doğrudur?', ['Yavruların tamamı saf döldür.','Yavruların %50’si çekinik fenotiplidir.','Yavruların tamamı baskın fenotiplidir.','Yavruların %25’i AA olur.'],1,'Aa ebeveyni A veya a verir; aa ebeveyni yalnızca a verir. Sonuç %50 Aa, %50 aa olur.')}${note('Çaprazlamada her ebeveynden tek bir alel geldiğini unutma.')}`,
()=>`${slideHead(20,'LGS düzeyi')}${quiz('Bir ailenin ilk iki çocuğu kızdır. Üçüncü çocuğun erkek olma olasılığı kaçtır?', ['%0','%25','%50','%75'],2,'Her gebelik bağımsızdır. X ya da Y taşıyan spermin döllenmeye katılması açısından basitleştirilmiş modelde olasılık %50’dir.')}${note('Önceki çocukların kromozomal cinsiyeti bir sonraki çocuğun olasılığını değiştirmez.')}`
];
function answer(t){return `<template class="answer-placeholder">${t}</template>`}function revealText(id,t){document.getElementById(id).textContent=t}function render(){document.getElementById('counter').textContent=`${idx+1} / 20`;document.getElementById('bar').style.width=((idx+1)/20*100)+'%';root.innerHTML=content[idx]();let template=root.querySelector('.answer-placeholder');if(template){let x=root.querySelector('#answer');if(x)x.innerHTML=template.innerHTML;template.remove()}document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===19;window.scrollTo(0,0)}function go(d){idx=Math.max(0,Math.min(19,idx+d));render()}document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown'].includes(e.key))go(1);if(['ArrowLeft','PageUp'].includes(e.key))go(-1)});render();
</script></body></html>
